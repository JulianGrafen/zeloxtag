name: Extraction quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  mock-extraction:
    name: Pre-deploy OCR mock gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Extraction quality mocks
        run: npm run test:extraction
